# Keeps the lockfile and the pinned Actions SHAs current without anyone
# remembering to. Grouped so a week's worth of patch/minor bumps arrives as
# one PR, not fifteen; majors stay separate because each one needs a human.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # These majors are planned migrations, each its own piece of work (see
    # the 2026-10-16 review, section E). Ignoring them here keeps the weekly
    # PR mergeable; remove a line when that migration is picked up.
    # vite, @vitejs/plugin-react, tailwindcss, tailwind-merge and
    # react-router-dom were taken on 2026-10-19 and are tracked again.
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@azure/msal-browser"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@azure/msal-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
