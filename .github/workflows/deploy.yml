name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        # Rollback: run this workflow by hand with the SHA (or tag) of the
        # last known-good commit and that build is redeployed as-is, with no
        # revert commit needed. Blank = the branch the run was started from.
        description: "Commit SHA or tag to deploy (blank = this branch's head)"
        required: false
        default: ""
      allow_rollback:
        # Deploys only move forward unless this is ticked — see the
        # "Refuse to go backwards" step below.
        description: "Allow publishing a LOWER version than the one live (an intentional rollback)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not moving tags, so a compromised
      # or force-pushed tag upstream can't change what runs here. The
      # trailing comment is the tag the SHA was resolved from; Dependabot
      # (.github/dependabot.yml) bumps both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Refuse to go backwards
        # GitHub Pages serves whichever deploy FINISHED last. Re-running an old
        # successful run republishes that old build over anything newer, and the
        # in-app update banner can't warn anyone because version.json goes back
        # with it. That happened on 2026-10-17: a re-run put 0.191.2 live for 80
        # minutes while main was on 0.191.3 (review finding OPS-05).
        #
        # So: compare the version this commit would publish with the one live,
        # and stop if it is LOWER. Equal is fine (docs-only commits keep the
        # version). An intentional rollback ticks `allow_rollback` on a manual
        # run. Runs before install and tests, so a refused run fails in seconds.
        # If the live file can't be read (first deploy, Pages down), it warns
        # and carries on rather than blocking a deploy on an outage.
        env:
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback || false }}
          LIVE_URL: https://altronic-llc.github.io/altronic-arc/version.json
        run: |
          next=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' public/version.json)
          live=$(curl -fsS --max-time 15 "$LIVE_URL?cb=$GITHUB_RUN_ID" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          echo "live=${live:-unknown} next=$next allow_rollback=$ALLOW_ROLLBACK"
          if [ -z "$live" ]; then
            echo "::warning::Couldn't read the live version.json; skipping the forward-only check."
            exit 0
          fi
          lowest=$(printf '%s\n%s\n' "$live" "$next" | sort -V | head -n1)
          if [ "$next" != "$live" ] && [ "$lowest" = "$next" ]; then
            if [ "$ALLOW_ROLLBACK" = "true" ]; then
              echo "::warning::Rolling back from $live to $next (allow_rollback was set)."
            else
              echo "::error::This run would publish $next over the live $live. If that is an intentional rollback, run 'Deploy to GitHub Pages' by hand with allow_rollback ticked. Otherwise re-run the LATEST green deploy instead."
              exit 1
            fi
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Node 24, the current LTS. It ships with npm 11, which is what
          # contributors run locally, so the lockfile shape agrees between
          # local and CI. Node 22 shipped npm 10, which rejects that
          # lockfile and forced an `npx -y npm@11 ci` workaround. The
          # workaround was removed with this upgrade.
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Test
        # Project standard is 100% unit-test coverage; tests must pass to
        # deploy. The vitest coverage threshold is intentionally off until
        # the existing codebase is backfilled — once that lands, switch on
        # the thresholds in vite.config.ts and add `-- --coverage` here.
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time env vars. These get baked into the static bundle.
          # GitHub repo Settings → Secrets and variables → Actions is where
          # you set these. Mock mode is the safe default for first deploys.
          VITE_USE_MOCK: ${{ vars.VITE_USE_MOCK || 'true' }}
          VITE_AZURE_CLIENT_ID: ${{ vars.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ vars.VITE_AZURE_TENANT_ID }}
          VITE_SP_SITE_ID: ${{ vars.VITE_SP_SITE_ID }}
          # Per-department site IDs (optional — config.ts has documented
          # defaults, so these only need setting to override).
          VITE_SP_ENGINEERING_SITE_ID: ${{ vars.VITE_SP_ENGINEERING_SITE_ID }}
          VITE_SP_PANELTEAM_SITE_ID: ${{ vars.VITE_SP_PANELTEAM_SITE_ID }}
          VITE_SP_PANEL_QC_ISSUES_LIST_ID: ${{ vars.VITE_SP_PANEL_QC_ISSUES_LIST_ID }}
          VITE_SP_PANEL_QC_DEFECTS_LIST_ID: ${{ vars.VITE_SP_PANEL_QC_DEFECTS_LIST_ID }}
          VITE_SP_SALESTEAM_SITE_ID: ${{ vars.VITE_SP_SALESTEAM_SITE_ID }}
          VITE_SP_SALES_ORDERENTRY_SITE_ID: ${{ vars.VITE_SP_SALES_ORDERENTRY_SITE_ID }}
          # SCNs (Supply Chain, ALTRONICSALESTEAM/SCN subsite). Documented
          # defaults in config.ts for all three, so a build without them still
          # points at the live list; set them only to override.
          VITE_SP_SCN_SITE_ID: ${{ vars.VITE_SP_SCN_SITE_ID }}
          VITE_SP_SCN_SITE_URL: ${{ vars.VITE_SP_SCN_SITE_URL }}
          VITE_SP_SALES_DOCUMENTATION_SITE_ID: ${{ vars.VITE_SP_SALES_DOCUMENTATION_SITE_ID }}
          VITE_SP_SALES_DOCUMENTATION_SITE_URL: ${{ vars.VITE_SP_SALES_DOCUMENTATION_SITE_URL }}
          VITE_SP_SCNS_LIST_ID: ${{ vars.VITE_SP_SCNS_LIST_ID }}
          VITE_SP_PMO_SITE_ID: ${{ vars.VITE_SP_PMO_SITE_ID }}
          # Insourcing Quotes (PMO site). NO defaults in config.ts — unset
          # reads as "not set up", and an unset Quote Roles list admits nobody.
          # Set all five after scripts/create-quote-lists.ps1 has run.
          VITE_SP_QUOTES_LIST_ID: ${{ vars.VITE_SP_QUOTES_LIST_ID }}
          VITE_SP_QUOTE_ASSEMBLIES_LIST_ID: ${{ vars.VITE_SP_QUOTE_ASSEMBLIES_LIST_ID }}
          VITE_SP_QUOTE_ITEMS_LIST_ID: ${{ vars.VITE_SP_QUOTE_ITEMS_LIST_ID }}
          VITE_SP_QUOTE_CUSTOMERS_LIST_ID: ${{ vars.VITE_SP_QUOTE_CUSTOMERS_LIST_ID }}
          VITE_SP_QUOTE_ROLES_LIST_ID: ${{ vars.VITE_SP_QUOTE_ROLES_LIST_ID }}
          VITE_SP_PRICING_ROLES_LIST_ID: ${{ vars.VITE_SP_PRICING_ROLES_LIST_ID }}
          VITE_SP_PRICING_REQUESTS_LIST_ID: ${{ vars.VITE_SP_PRICING_REQUESTS_LIST_ID }}
          VITE_SP_PRICING_HISTORY_LIST_ID: ${{ vars.VITE_SP_PRICING_HISTORY_LIST_ID }}
          VITE_SP_NEW_PRODUCT_PRICING_LIST_ID: ${{ vars.VITE_SP_NEW_PRODUCT_PRICING_LIST_ID }}
          VITE_SP_NP_SUBASSEMBLIES_LIST_ID: ${{ vars.VITE_SP_NP_SUBASSEMBLIES_LIST_ID }}
          VITE_SP_CUSTOMER_QUOTES_LIST_ID: ${{ vars.VITE_SP_CUSTOMER_QUOTES_LIST_ID }}
          VITE_PRICING_LIVE: ${{ vars.VITE_PRICING_LIVE }}
          VITE_PRICING_PREVIEW_USERS: ${{ vars.VITE_PRICING_PREVIEW_USERS }}
          VITE_SP_MCNS_LIST_ID: ${{ vars.VITE_SP_MCNS_LIST_ID }}
          VITE_SP_MCN_ROLES_LIST_ID: ${{ vars.VITE_SP_MCN_ROLES_LIST_ID }}
          VITE_SP_MCN_DISTRIBUTION_GROUPS_LIST_ID: ${{ vars.VITE_SP_MCN_DISTRIBUTION_GROUPS_LIST_ID }}
          VITE_MCN_LIVE: ${{ vars.VITE_MCN_LIVE }}
          VITE_SP_LIST_ID: ${{ vars.VITE_SP_LIST_ID }}
          VITE_SP_PROJECTS_LIST_ID: ${{ vars.VITE_SP_PROJECTS_LIST_ID }}
          VITE_SP_TEST_RESULTS_LIST_ID: ${{ vars.VITE_SP_TEST_RESULTS_LIST_ID }}
          VITE_SP_EIRS_LIST_ID: ${{ vars.VITE_SP_EIRS_LIST_ID }}
          VITE_SHARED_MAILBOX: ${{ vars.VITE_SHARED_MAILBOX }}
          VITE_SP_SITE_URL: ${{ vars.VITE_SP_SITE_URL }}
          VITE_SP_ADMINS_LIST_ID: ${{ vars.VITE_SP_ADMINS_LIST_ID }}
          VITE_SP_EIR_ROLES_LIST_ID: ${{ vars.VITE_SP_EIR_ROLES_LIST_ID }}
          # Quick Links (Admin → Quick Links). No default in config.ts — the
          # Dashboard just shows no Quick Links anywhere until this is set.
          VITE_SP_QUICK_LINKS_LIST_ID: ${{ vars.VITE_SP_QUICK_LINKS_LIST_ID }}
          # ARC Feature Requests (Header's "Suggest a feature" button). No
          # default in config.ts — the screen reports itself as "not
          # configured yet" until this is set, same as Quick Links.
          VITE_SP_FEATURE_REQUESTS_LIST_ID: ${{ vars.VITE_SP_FEATURE_REQUESTS_LIST_ID }}
          # ECN Checklists (the MFGFRM-038 checklist on each ECN). No default
          # in config.ts — the checklist card on an ECN reports itself "not
          # configured" until this is set, same as Quick Links.
          VITE_SP_ECN_CHECKLISTS_LIST_ID: ${{ vars.VITE_SP_ECN_CHECKLISTS_LIST_ID }}
          # QC Forms — GET-1 (GE Transportation Log Sheet), PMO site. No
          # default in config.ts — the GET-1 screen says the variable isn't
          # set until scripts/create-qc-form-list.ps1 has built the list.
          VITE_SP_QC_GET1_LIST_ID: ${{ vars.VITE_SP_QC_GET1_LIST_ID }}
          # MRB Data (Supply Chain, PMO site). Documented default in
          # config.ts, so a build without this still points at the live list;
          # set it only to override.
          VITE_SP_MRB_LIST_ID: ${{ vars.VITE_SP_MRB_LIST_ID }}
          # Altronic Part List / Component List (Engineering site). Documented
          # defaults in config.ts, so a build without these still points at
          # the live lists; set them only to override.
          VITE_SP_ALTRONIC_PART_LIST_ID: ${{ vars.VITE_SP_ALTRONIC_PART_LIST_ID }}
          VITE_SP_ALTRONIC_COMPONENT_LIST_ID: ${{ vars.VITE_SP_ALTRONIC_COMPONENT_LIST_ID }}
          # Parts Roles — who may add, edit and approve parts. Documented
          # default in config.ts (it only admits people on the list); set it
          # only to override.
          VITE_SP_PARTS_ROLES_LIST_ID: ${{ vars.VITE_SP_PARTS_ROLES_LIST_ID }}
          VITE_SP_COMPONENT_DESCRIPTION_OPTIONS_LIST_ID: ${{ vars.VITE_SP_COMPONENT_DESCRIPTION_OPTIONS_LIST_ID }}
          VITE_SP_MAINTENANCE_TASKS_LIST_ID: ${{ vars.VITE_SP_MAINTENANCE_TASKS_LIST_ID }}
          VITE_SP_SCHEDULED_MAINTENANCE_LIST_ID: ${{ vars.VITE_SP_SCHEDULED_MAINTENANCE_LIST_ID }}
          # Maintenance Departments / Locations — the two admin-managed
          # reference lists that replaced the Department / Location CHOICE
          # columns. Documented defaults in config.ts, so a build without
          # these still points at the live lists; set them only to override.
          VITE_SP_MAINTENANCE_DEPARTMENTS_LIST_ID: ${{ vars.VITE_SP_MAINTENANCE_DEPARTMENTS_LIST_ID }}
          VITE_SP_MAINTENANCE_LOCATIONS_LIST_ID: ${{ vars.VITE_SP_MAINTENANCE_LOCATIONS_LIST_ID }}
          # Harness Production Log + Harness Part Numbers (Operations, PMO).
          # No defaults in config.ts — the screen says "not set up yet" until
          # scripts/create-harness-production-lists.ps1 has run and these are set.
          VITE_SP_HARNESS_PRODUCTION_LOG_LIST_ID: ${{ vars.VITE_SP_HARNESS_PRODUCTION_LOG_LIST_ID }}
          VITE_SP_HARNESS_PART_NUMBERS_LIST_ID: ${{ vars.VITE_SP_HARNESS_PART_NUMBERS_LIST_ID }}
          # Maintenance Roles (Admin -> Maintenance Roles). No default in
          # config.ts — setting this switches CMMS role gating ON, so populate
          # the list first. Until it is set, everyone signed in keeps the
          # permissions they have today.
          VITE_SP_MAINTENANCE_ROLES_LIST_ID: ${{ vars.VITE_SP_MAINTENANCE_ROLES_LIST_ID }}
          # Open Orders Report Tool (Sales). The customer list id has NO
          # default in config.ts — the feature reports itself as "not set up"
          # until this is both set as a repo variable AND a deploy has run,
          # because VITE_* values are baked in at build time.
          VITE_SP_OPEN_ORDERS_CUSTOMERS_LIST_ID: ${{ vars.VITE_SP_OPEN_ORDERS_CUSTOMERS_LIST_ID }}
          # Optional: setting this switches Open Orders role gating ON.
          VITE_SP_OPEN_ORDERS_ROLES_LIST_ID: ${{ vars.VITE_SP_OPEN_ORDERS_ROLES_LIST_ID }}
          # Recipient lists and people config. These have documented defaults in
          # config.ts, so the app works without them — but they were documented
          # as env-overridable while the build had no way to receive them, which
          # made that untrue in production.
          VITE_GRAY_MARKET_NEW_REQUEST_ALERTS: ${{ vars.VITE_GRAY_MARKET_NEW_REQUEST_ALERTS }}
          VITE_GRAY_MARKET_CHANGE_ALERTS: ${{ vars.VITE_GRAY_MARKET_CHANGE_ALERTS }}
          VITE_FAIT_NEW_ALERTS: ${{ vars.VITE_FAIT_NEW_ALERTS }}
          VITE_FAIT_SQE_REVIEWERS: ${{ vars.VITE_FAIT_SQE_REVIEWERS }}
          VITE_BUILD_REQUEST_PRODUCTION_ALERTS: ${{ vars.VITE_BUILD_REQUEST_PRODUCTION_ALERTS }}
          VITE_BUILD_REQUEST_COMPLETE_REVIEWERS: ${{ vars.VITE_BUILD_REQUEST_COMPLETE_REVIEWERS }}
          VITE_BUILD_REQUEST_FINAL_ALERTS: ${{ vars.VITE_BUILD_REQUEST_FINAL_ALERTS }}
          VITE_COST_IMPACT_NOTICE_ALERTS: ${{ vars.VITE_COST_IMPACT_NOTICE_ALERTS }}
          # ARC Feature Requests — the intake queue for new requests AND for
          # status changes. Defaults to Ray alone in config.ts, so this only
          # needs setting to add or change recipients.
          VITE_FEATURE_REQUEST_ALERTS: ${{ vars.VITE_FEATURE_REQUEST_ALERTS }}
          VITE_EIR_TRIAGE_PROJECT_REVIEWERS: ${{ vars.VITE_EIR_TRIAGE_PROJECT_REVIEWERS }}
          VITE_EIR_TRIAGE_ASSIGNERS: ${{ vars.VITE_EIR_TRIAGE_ASSIGNERS }}
          VITE_EIR_RESPONSE_ACCEPTED_ALERTS: ${{ vars.VITE_EIR_RESPONSE_ACCEPTED_ALERTS }}
          VITE_EIR_CLOSED_ALERTS: ${{ vars.VITE_EIR_CLOSED_ALERTS }}
          VITE_HIDDEN_PEOPLE: ${{ vars.VITE_HIDDEN_PEOPLE }}
          VITE_APP_MANAGER_EMAIL: ${{ vars.VITE_APP_MANAGER_EMAIL }}
          # QZ Tray silent printing (Panel QC label). Unset = always the
          # browser's print dialog — nothing here can make printing worse.
          VITE_PANEL_QC_LABEL_PRINTER_NAME: ${{ vars.VITE_PANEL_QC_LABEL_PRINTER_NAME }}
          # The cert is public by definition (it's what QZ Tray verifies a
          # signed request against), so it's an ordinary repo VARIABLE. The
          # private key ends up in the built bundle too — see qzPrint.ts's
          # comment on why that's an accepted trade-off for this feature —
          # but it's still sourced from a repo SECRET rather than a variable
          # so it isn't sitting in plaintext on the repo's Variables page or
          # echoed in a workflow log.
          VITE_QZ_CERTIFICATE: ${{ vars.VITE_QZ_CERTIFICATE }}
          VITE_QZ_PRIVATE_KEY: ${{ secrets.VITE_QZ_PRIVATE_KEY }}

      - name: Add 404 fallback for client-side routing
        # GitHub Pages serves /404.html for any unmatched path. Copying
        # index.html to 404.html means the SPA's client-side router still
        # picks up the URL on a hard refresh of e.g. /task/15.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
